name: Claude Code Review

# Based on the anthropics/claude-code-action pr-review-comprehensive.yml example:
# https://github.com/anthropics/claude-code-action/blob/main/examples/pr-review-comprehensive.yml

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is the Fitness Avatar Simulator, a college multimedia mini-project.
            Read CLAUDE.md and docs/IMPLEMENTATION_PLAN.md in the repo root first, so you
            know the project's working rules, hard rules and the phase this PR belongs to.

            Then read the PR description and every comment on the PR.

            Find the issue this PR closes (the PR description or a commit message says
            "Closes #N"). Read that issue in full, including its "Done when" list, and check
            the PR against every point in that list. Call out any point that is not met.

            Check scope:
            - The PR should only change files that the linked issue says it may change.
              Flag any file outside that scope.
            - If the PR touches client/src/services/sessions.js, confirm it still exports
              exactly these five functions, and that every one of them is async:
              saveSession, getSessions, getSessionsSince, addSampleSessions, clearSessions.

            Look for:
            - Bugs, broken imports, or anything that would crash the app.
            - Any committed secrets: API keys, Firebase service-account keys, or a .env file.
            - Any file over 15 MB (this project keeps avatar.glb files small; see CLAUDE.md).
            - Any change to client/src/pose/ or client/src/data/exercises.json made by anyone
              other than sreenandhan-17. If the PR author is sreenandhan-17, this is fine;
              otherwise flag it clearly, since pose/rep-counting logic should stay with Balu.

            Reporting:
            - Post inline comments on the specific lines where you found a problem.
            - Then post one summary comment on the PR with these sections, in this order:
              "Must fix", "Nice to have", "Looks good".
              End the summary with exactly one of these two lines on its own:
              "Ready for Balu's review" (if there is nothing under "Must fix")
              "Changes needed" (if there is anything under "Must fix")

            Do not approve this pull request and do not merge it. Your job is to review and
            comment only; a human (Balu) makes the final call.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
